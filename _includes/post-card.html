{% comment %}
  Usage: {% include post-card.html post=some_post %}
{% endcomment %}
{% assign p = include.post %}
<a class="post-card-link" href="{{ p.url | relative_url }}">
  <div class="post-card" data-category="{{ p.category | slugify }}" data-title="{{ p.title | downcase }}">
    <div class="pc-image" style="background-image:url('{{ p.image }}'); background-size:cover; background-position:center;">
    </div>
    <div class="pc-body">
      <span class="cat-badge">{{ p.category }}</span>
      <h3>{{ p.title }}</h3>
      <p class="pc-excerpt">{{ p.description }}</p>
    </div>
  </div>
</a>
